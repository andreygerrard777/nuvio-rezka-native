name: Build native Rezka diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install required Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test repository packaging
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test and build CS3
        run: bash ./gradlew --no-daemon :RezkaDiagnostics:testDebugUnitTest :RezkaDiagnostics:make
      - name: Assemble repository bundle
        env:
          RELEASE_TAG: native-probe-${{ github.run_number }}
        run: >-
          python3 scripts/package_repo.py
          --cs3 RezkaDiagnostics/build/RezkaDiagnostics.cs3
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-probe-${{ github.run_number }}
          path: native/dist/
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: native/RezkaDiagnostics/build/reports/tests/
          if-no-files-found: ignore
